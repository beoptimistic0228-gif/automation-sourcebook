<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동화 소재 — 세인투 실행조 시즌2 자동화 트랙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF6E5; --cream-2:#FFEFD2; --ink:#1C1A16; --ink-70:#57524A;
  --coral:#FF6B4A; --lemon:#FFCE2E; --mint:#2FC9A4; --sky:#4FA8FF; --lav:#9B8CFF; --tang:#FF9B3D; --leaf:#7BD44A;
  --disp:"Jua",sans-serif; --sans:"Gothic A1",sans-serif; --en:"Fredoka",sans-serif;
  --pad:clamp(18px,4.5vw,72px);
  --shadow:5px 5px 0 var(--ink); --shadow-lg:9px 9px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);font-size:17px;line-height:1.75;color:var(--ink);
  background:var(--cream);
  background-image:radial-gradient(var(--cream-2) 2.4px, transparent 2.4px);
  background-size:22px 22px;-webkit-font-smoothing:antialiased;
}
header{background:var(--ink);color:var(--cream);padding:16px var(--pad);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-size:23px;display:flex;align-items:center;gap:9px}
.logo .dot{width:15px;height:15px;border-radius:50%;background:var(--lemon);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--coral)}
header .who{margin-left:auto;font-size:14px;opacity:.72}

.hero{padding:clamp(44px,7vw,86px) var(--pad) clamp(26px,4vw,44px);position:relative;overflow:hidden}
.badge{display:inline-block;background:var(--lemon);border:3px solid var(--ink);border-radius:999px;
  padding:7px 20px;font-family:var(--en);font-size:13px;font-weight:700;letter-spacing:.12em;
  box-shadow:4px 4px 0 var(--ink);transform:rotate(-2.5deg);text-transform:uppercase}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(30px,5.4vw,62px);line-height:1.24;
  margin:24px 0 20px;letter-spacing:-.01em;max-width:22ch}
.hero h1 .hi{display:inline-block;background:var(--coral);color:var(--cream);padding:0 .16em;border-radius:12px;
  transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--ink);border:3px solid var(--ink)}
.hero p{font-size:clamp(17px,1.7vw,20px);max-width:44ch;color:var(--ink-70);font-weight:500}
.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.blob{position:absolute;border-radius:50%;border:3px solid var(--ink);z-index:-1}
.blob.a{width:150px;height:150px;background:var(--mint);right:6%;top:12%;opacity:.85}
.blob.b{width:78px;height:78px;background:var(--lav);right:20%;top:56%}
@media(max-width:820px){.blob{display:none}}

.tabwrap{padding:10px var(--pad) 4px;position:sticky;top:0;z-index:30;background:var(--cream);
  background-image:radial-gradient(var(--cream-2) 2.4px,transparent 2.4px);background-size:22px 22px;
  border-bottom:3px solid var(--ink)}
.tabs{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:16px;padding:11px 18px 11px 13px;
  display:flex;align-items:center;gap:9px;white-space:nowrap;box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease,background .12s}
.tab:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.tab:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--c);transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tab .ico{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--ink);background:var(--c);
  display:grid;place-items:center;font-size:17px;line-height:1;flex:0 0 auto}
.tab[aria-selected="true"] .ico{background:#fff}
.tab .n{font-family:var(--en);font-size:12px;background:var(--ink);color:var(--cream);border-radius:999px;padding:2px 8px}

main{padding:clamp(30px,4.5vw,56px) var(--pad) 100px}
.listhead{display:flex;align-items:center;gap:14px;margin-bottom:30px;flex-wrap:wrap}
.listhead h2{font-family:var(--disp);font-weight:400;font-size:clamp(24px,3.4vw,38px)}
.listhead .pill{background:var(--ink);color:var(--cream);border-radius:999px;padding:5px 15px;font-family:var(--en);font-size:12.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;overflow:hidden;cursor:pointer;
  text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease;
  animation:pop .42s cubic-bezier(.34,1.4,.5,1) backwards}
.card:hover{transform:translate(-3px,-3px) rotate(-.5deg);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

.thumb{position:relative;aspect-ratio:16/10;border-bottom:3px solid var(--ink);background:var(--c);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 12px,transparent 12px 24px);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb .glyph{font-size:64px;line-height:1;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.18))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kind{position:absolute;top:10px;left:10px;z-index:2;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;box-shadow:2.5px 2.5px 0 var(--ink);
  white-space:nowrap;max-width:calc(60% - 14px);overflow:hidden;text-overflow:ellipsis}
.kind.own{background:var(--coral);color:#fff}
.kind.real{background:var(--mint)}
.src{position:absolute;bottom:0;left:0;right:0;z-index:2;background:rgba(28,26,22,.86);color:var(--cream);
  font-size:12.5px;padding:6px 12px;display:flex;gap:7px;align-items:center}
.src b{font-weight:700}
.tool{position:absolute;right:12px;top:12px;z-index:2;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
/* 배경판 없이 로고만 — 사진·패턴 위에서도 읽히게 흰 글로우 + 그림자만 얹는다 */
.tool img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.7))
         drop-shadow(2px 2px 0 rgba(28,26,22,.28))}

.cbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:11px;flex:1}
.cbody h3{font-family:var(--disp);font-weight:400;font-size:23px;line-height:1.4}
.cbody .sum{color:var(--ink-70);font-size:16.5px;flex:1;font-weight:500}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;font-weight:700;padding:4px 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--lemon)}
.chip.w{background:#fff}
.chip.tool-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 5px}
.chip.tool-chip img{width:22px;height:22px;object-fit:contain;display:block}
.go{font-family:var(--en);font-size:13px;display:flex;align-items:center;gap:8px;transition:gap .16s}
.card:hover .go{gap:14px}

dialog{border:4px solid var(--ink);border-radius:26px;padding:0;background:var(--cream);color:var(--ink);
  width:min(94vw,780px);box-shadow:12px 12px 0 var(--ink);overflow:hidden;
  margin:auto;max-height:90vh;display:block}
dialog:not([open]){display:none}
dialog::backdrop{background:rgba(28,26,22,.55)}
dialog[open]{animation:dpop .34s cubic-bezier(.34,1.35,.5,1)}
@keyframes dpop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.d-hero{position:relative;aspect-ratio:21/8;border-bottom:4px solid var(--ink);background:var(--c);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 14px,transparent 14px 28px);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.d-hero .glyph{font-size:76px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.18))}
.d-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-close{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border:3px solid var(--ink);
  background:#fff;border-radius:50%;cursor:pointer;font-size:21px;line-height:1;box-shadow:3px 3px 0 var(--ink)}
.d-close:hover{background:var(--coral);color:#fff}
.d-top{padding:22px clamp(20px,4vw,44px) 18px}
.d-top h2{font-family:var(--disp);font-weight:400;font-size:clamp(25px,3.6vw,36px);line-height:1.32;margin:10px 0 0}
.d-body{padding:8px clamp(20px,4vw,44px) 40px;display:flex;flex-direction:column;gap:26px;max-height:54vh;overflow:auto}
.sec h4{font-family:var(--en);font-size:12.5px;background:var(--lemon);border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 13px;display:inline-block;margin-bottom:12px;box-shadow:2.5px 2.5px 0 var(--ink)}
.sec p{font-size:17px;font-weight:500}
.sec ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.sec li{padding-left:26px;position:relative;font-size:17px;font-weight:500}
.sec li::before{content:"✦";position:absolute;left:0;top:0;color:var(--coral);font-size:15px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flow div{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 12px;box-shadow:3px 3px 0 var(--ink)}
.flow b{display:block;font-family:var(--en);font-size:10.5px;margin-bottom:7px;color:var(--ink-70)}
.flow span{font-size:15.5px;line-height:1.5;font-weight:500}
.sec .lead{font-size:18.5px;font-weight:700;line-height:1.6}
.sec .hint{font-size:15px;color:var(--ink-70);font-weight:500;margin-bottom:10px}
.links a .tn.plain{display:flex;align-items:center;justify-content:center;background:none;border:0}
.links a .tn.plain img{width:40px;height:40px;object-fit:contain;display:block}
.note.first{background:var(--lemon)}
.note.warn{background:#fff;border-style:dashed}
.note.srcnote{margin-bottom:10px;font-size:16px}
.sec ol.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px}
.sec ol.steps li{counter-increment:st;padding-left:38px;position:relative;font-size:16.5px;font-weight:500}
.sec ol.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:26px;height:26px;
  background:var(--ink);color:var(--cream);border-radius:50%;display:grid;place-items:center;
  font-family:var(--en);font-size:12.5px}
.sec ul.nums li::before{content:"✔";color:var(--mint)}
blockquote.q{background:var(--cream-2);border:3px solid var(--ink);border-left-width:9px;border-radius:14px;
  padding:13px 16px;margin:0 0 9px;font-size:16.5px;font-weight:500;box-shadow:3px 3px 0 var(--ink)}
.note{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:3px 3px 0 var(--ink);font-weight:500}
.links{display:flex;flex-direction:column;gap:10px}
.links a{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:16px;
  box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.links a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--lemon)}
.links a .tn{width:76px;height:48px;flex:0 0 auto;border:2.5px solid var(--ink);border-radius:9px;object-fit:cover;background:var(--cream-2)}
.links a .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.links a .tx span{font-size:12.5px;font-weight:500;color:var(--ink-70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links a .role{font-family:var(--en);font-size:10.5px;background:var(--ink);color:var(--cream);border-radius:999px;padding:2px 9px;margin-left:auto;flex:0 0 auto}
@media(max-width:640px){.flow{grid-template-columns:1fr 1fr}.links a .role{display:none}}

footer{border-top:3px solid var(--ink);background:var(--ink);color:var(--cream);padding:28px var(--pad) 52px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14.5px}
footer .stamp{font-family:var(--en);font-size:11.5px;opacity:.6}
</style>
</head>

/* 대표 이미지는 「출처」로 확정된 자료만 쓴다 — 관련 영상·관련 글 썸네일을
   카드 대표 이미지로 쓰면 카드 내용과 어긋나 보인다 (Owner 결정 2026-09-09) */
function pickCover(it){
  if (!it.refs) return null;
  for (var i = 0; i < it.refs.length; i++) if (it.refs[i].role.indexOf('출처') === 0) return it.refs[i];
  return null;
}

var tabsEl = document.getElementById('tabs');
var grid = document.getElementById('grid');
var dlg = document.getElementById('dlg');

DATA.forEach(function(g, i){
  var b = document.createElement('button');
  b.className = 'tab';
  b.style.setProperty('--c', g.c);
  b.setAttribute('role','tab');
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.innerHTML = '<span class="ico">' + g.ico + '</span>' + g.t +
                '<span class="n">' + String(g.items.length).padStart(2,'0') + '</span>';
  b.onclick = function(){ select(i); };
  tabsEl.appendChild(b);
});

function select(i){
  Array.prototype.forEach.call(tabsEl.children, function(b, j){
    b.setAttribute('aria-selected', i === j ? 'true' : 'false');
  });
  var g = DATA[i];
  document.getElementById('listTitle').textContent = g.ico + ' ' + g.t;
  document.getElementById('listCount').textContent = String(g.items.length).padStart(2,'0') + ' CASES';
  grid.innerHTML = '';
  g.items.forEach(function(it, k){
    var kd = KIND[it.k];
    var ref = pickCover(it);
    var c = document.createElement('button');
    c.className = 'card';
    c.style.setProperty('--c', g.c);
    c.style.animationDelay = (k * 80) + 'ms';
    var thumbInner = '<span class="glyph">' + it.g + '</span>';
    if (ref) {
      thumbInner += '<img src="' + ref.th + '" alt="" loading="lazy" referrerpolicy="no-referrer" ' +
        'onerror="this.remove()">' +
        '<span class="src">' + ref.role + ' · <b>' + ref.p + '</b></span>';
    }
    c.innerHTML =
      '<div class="thumb"><span class="kind ' + kd[1] + '">' + kd[0] + '</span>' +
        '<span class="tool" title="' + it.tool + '">' + TOOL[it.tool] + '</span>' + thumbInner + '</div>' +
      '<div class="cbody"><h3>' + it.h + '</h3>' +
      '<div class="sum">' + it.s + '</div>' +
      '<div class="chips"><span class="chip w tool-chip">' + TOOL[it.tool] + it.tool + '</span>' +
      (it.refs.length ? '<span class="chip w">🔗 자료 ' + it.refs.length + '</span>' : '') +
      '</div><div class="go">자세히 보기 &rarr;</div></div>';
    c.onclick = function(){ openCase(g, it); };
    grid.appendChild(c);
  });
}

function openCase(g, it){
  var kd = KIND[it.k];
  var ref = pickCover(it);
  document.getElementById('dHero').style.setProperty('--c', g.c);
  document.getElementById('dGlyph').textContent = it.g;
  var img = document.getElementById('dImg');
  if (ref) { img.hidden = false; img.src = ref.th; img.onerror = function(){ img.hidden = true; }; }
  else { img.hidden = true; img.removeAttribute('src'); }

  document.getElementById('dMeta').innerHTML =
    '<span class="chip w">' + kd[0] + '</span>' +
    '<span class="chip">' + g.ico + ' ' + g.t + '</span>' +
    '';
  document.getElementById('dTitle').textContent = it.h;

  var refsHtml = it.refs.map(function(r){
    return '<a href="' + r.u + '" target="_blank" rel="noopener noreferrer">' +
      '<img class="tn" src="' + r.th + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' +
      '<span class="tx">' + r.t + '<span>' + r.p + '</span></span>' +
      '<span class="role">' + r.role + '</span></a>';
  }).join('');
  refsHtml += '<a href="' + DOC[it.tool] + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="tx">' + it.tool + ' 공식 문서<span>' + DOC[it.tool].replace('https://','') + '</span></span>' +
      '<span class="role">문서</span></a>';

  document.getElementById('dBody').innerHTML =
    '<div class="sec"><h4>개요</h4><p class="lead">' + it.s + '</p></div>' +

    '<div class="sec"><h4>목적</h4><p>' + it.pain + '</p></div>' +

    '<div class="sec"><h4>자동화 내용</h4>' +
      '<p class="hint">아래 네 칸은 어떤 자동화든 같습니다. 시작만 다르고 뒤는 같습니다.</p>' +
      '<div class="flow">' +
      it.flow.map(function(v, i){ return '<div><b>' + F[i] + '</b><span>' + v + '</span></div>'; }).join('') +
    '</div></div>' +

    (it.steps ? '<div class="sec"><h4>출처에서 확인된 순서</h4><ol class="steps">' +
      it.steps.map(function(v){ return '<li>' + v + '</li>'; }).join('') + '</ol></div>' : '') +

    (it.numbers ? '<div class="sec"><h4>확인된 기준·수치</h4><ul class="nums">' +
      it.numbers.map(function(v){ return '<li>' + v + '</li>'; }).join('') + '</ul></div>' : '') +

    (it.prompts ? '<div class="sec"><h4>실제로 쓰인 말</h4>' +
      '<p class="hint">출처에 원문으로 실린 문장입니다. 그대로 따라 쓰셔도 됩니다.</p>' +
      it.prompts.map(function(v){ return '<blockquote class="q">' + v + '</blockquote>'; }).join('') + '</div>' : '') +

    (it.pitfall ? '<div class="sec"><h4>출처가 겪은 실패</h4><p class="note warn">' + it.pitfall + '</p></div>' : '') +

    '<div class="sec"><h4>사용 도구</h4><div class="links">' +
      '<a href="' + DOC[it.tool] + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="tn plain">' + TOOL[it.tool] + '</span>' +
        '<span class="tx">' + it.tool + '<span>공식 문서 보기 · ' + DOC[it.tool].replace('https://','') + '</span></span>' +
      '</a></div></div>' +

    '<div class="sec"><h4>필요한 것</h4><ul>' +
      it.need.map(function(n){ return '<li>' + n + '</li>'; }).join('') +
    '</ul></div>' +

    '<div class="sec"><h4>어려운 지점</h4><p class="note">' + it.hard + '</p></div>' +

    '<div class="sec"><h4>첫 걸음</h4><p class="note first">' + it.first + '</p></div>' +

    '<div class="sec"><h4>출처</h4>' +
      (it.srcNote ? '<p class="note warn srcnote">' + it.srcNote + '</p>' : '') +
      (it.refs.length
        ? '<div class="links">' + it.refs.map(function(r){
            return '<a href="' + r.u + '" target="_blank" rel="noopener noreferrer">' +
              '<img class="tn" src="' + r.th + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' +
              '<span class="tx">' + r.t + '<span>' + r.p + '</span></span>' +
              '<span class="role">' + r.role + '</span></a>';
          }).join('') + '</div>'
        : (it.k === 'own' ? '<p class="note">낙관이 실제로 돌리고 있는 자동화입니다. 외부 출처가 아니라 본인 사례이고, 궁금한 점은 줌에서 물어보시면 화면으로 보여 드립니다.</p>' : '<p class="note warn">검증된 공개 사례를 찾지 못했습니다. 낙관이 제안하는 <b>응용 아이디어</b>이고, 위 내용은 실측이 아닙니다. 직접 만들어 보신 뒤 사례로 올려 주시면 이 카드가 실사례로 바뀝니다.</p>')) +
    '</div>';

  dlg.showModal();
}

document.getElementById('dlgClose').onclick = function(){ dlg.close(); };
dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
select(0);
</script>
